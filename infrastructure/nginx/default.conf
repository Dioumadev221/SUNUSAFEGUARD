# Sert le frontend et relaie /api vers le backend FastAPI.
# En production : terminer TLS en amont (ou ajouter un bloc listen 443 ssl).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aucune journalisation des requêtes (pas d'IP ni d'URL de parcours d'utilisatrices).
    access_log off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; worker-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 12m;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
